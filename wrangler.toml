# Cloudflare Wrangler 配置文件
# 部署到 Cloudflare Workers

name = "taluo"
main = ".vercel/output/static/_worker.js/index.js"
find_additional_modules = true
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run cf-build"

[[rules]]
type = "ESModule"
globs = ["__next-on-pages-dist__/**/*.js"]

# 静态资源（Next.js 生成的 HTML/JS/CSS）
[assets]
directory = ".vercel/output/static"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "taluo-db"
database_id = "e100f112-408f-401c-9926-a19fb31ea2e3"

# 环境变量
[vars]
ADMIN_SECRET = "taluo-admin-secret-change-me-in-production"

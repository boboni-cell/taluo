# Cloudflare Wrangler 配置文件
# 用于部署到 Cloudflare Pages (with Workers / D1)

name = "taluo"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pages 构建输出目录（由 @cloudflare/next-on-pages 生成）
pages_build_output_dir = ".vercel/output/static"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "taluo-db"
database_id = "e100f112-408f-401c-9926-a19fb31ea2e3"  # 替换为你的 D1 数据库 ID

# 环境变量
[vars]
ADMIN_SECRET = "taluo-admin-secret-change-me-in-production"
